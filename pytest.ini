[pytest]
# Конфигурация pytest для E2E и smoke тестирования

# Корень проекта в sys.path
pythonpath = .

# importlib mode предотвращает конфликт tests/i18n/ с корневым i18n/
addopts = --import-mode=importlib

# asyncio mode для smoke-тестов
asyncio_mode = auto

# Игнорировать предупреждения
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
