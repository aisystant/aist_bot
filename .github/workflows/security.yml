name: Security (B5.2 SAST + B5.3 Audit)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pip-audit:
    name: pip audit (B5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: pip audit (high+critical)
        run: pip-audit -r requirements.txt --severity high

  bandit:
    name: Bandit SAST (B5.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Bandit scan
        run: bandit -r . -ll -x ./tests,./node_modules --format txt
