name: Release Control Import Guard

on:
  push:
    branches: [new-architecture]
  pull_request:
    branches: [new-architecture]

permissions:
  contents: read
  actions: read

jobs:
  release-control-import-guard:
    name: release-control-import-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Refuse unenforced release-control files on the built branch
        run: python3 scripts/release_control_import_guard.py --branch new-architecture

      - name: Verify production approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[].reviewer.login] | sort')
          branch_policy=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
            --jq '[.protection_rules[].type] | index("branch_policy") != null')
          policy_count=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies" \
            --jq '.total_count')
          production_branches=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies" \
            --jq '[.branch_policies[] | select(.type == "branch") | .name] | sort')
          if [[ "$reviewers" != '["TserenTserenov"]' || "$branch_policy" != "true" \
            || "$policy_count" != "1" || "$production_branches" != '["new-architecture"]' ]]; then
            echo "::error::Production approval gate is weakened: reviewers=$reviewers branch_policy=$branch_policy policy_count=$policy_count production_branches=$production_branches"
            exit 1
          fi
