name: Smoke Tests (L1+L2)

on:
  push:
    branches: [pilot, new-architecture]
  pull_request:
    branches: [pilot, new-architecture]

permissions:
  contents: read

jobs:
  smoke-tests:
    name: L1+L2 Smoke/Regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Check release infrastructure
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -I -B -m pytest -p no:cacheprovider
          tests/test_release_smoke.py
          tests/test_release_drift_detector.py
          tests/test_release_drift_ci.py
          tests/test_branch_auto_deploy.py
          -q --tb=short

      - name: Run the exact candidate smoke profile
        run: |
          python -I -B scripts/run_release_smoke.py \
            --candidate-commit "${GITHUB_SHA}" \
            --profile l1-l2 \
            --output-dir "${RUNNER_TEMP}/release-smoke-${GITHUB_RUN_ATTEMPT}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-test-results
          path: ${{ runner.temp }}/release-smoke-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30

  post-deploy-healthcheck:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: github.ref == 'refs/heads/new-architecture' && github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - name: Wait for Railway deploy
        run: sleep 120

      - name: Check bot health
        # BOT_HEALTH_URL = Railway domain, e.g. https://aist-bot-newarchitecture-production.up.railway.app
        run: |
          BOT_URL="${{ secrets.BOT_HEALTH_URL }}"
          if [ -z "$BOT_URL" ]; then
            echo "BOT_HEALTH_URL secret not set, skipping"
            exit 0
          fi
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BOT_URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Bot is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying in 30s..."
            sleep 30
          done
          echo "Bot health check failed after 3 attempts"
          exit 1
