name: Smoke Tests (L1+L2)

on:
  push:
    branches: [pilot, new-architecture]
  pull_request:
    branches: [pilot, new-architecture]

permissions:
  contents: read

jobs:
  smoke-tests:
    name: l1-l2-smoke-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Check release infrastructure
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -I -B -m pytest -p no:cacheprovider
          tests/test_release_smoke.py
          tests/test_release_drift_detector.py
          tests/test_release_drift_ci.py
          tests/test_branch_auto_deploy.py
          tests/test_release_behavior_scenarios.py
          -q --tb=short

      - name: Run the exact candidate smoke profile
        run: |
          python -I -B scripts/run_release_smoke.py \
            --candidate-commit "${GITHUB_SHA}" \
            --profile l1-l2 \
            --output-dir "${RUNNER_TEMP}/release-smoke-${GITHUB_RUN_ATTEMPT}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-test-results
          path: ${{ runner.temp }}/release-smoke-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30


  dt-writer-safety:
    name: DT writer safety (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies and PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          test "$(id -u)" -ne 0
          /usr/lib/postgresql/16/bin/postgres --version
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock
      - name: Test disposable database concurrency and rollback
        run: |
          python -m pytest tests/test_dt_writer_safety.py -v --tb=short \
            --junitxml=dt-writer-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('dt-writer-results.xml').findall('.//testcase')
          if not cases or any(case.find('skipped') is not None for case in cases):
              raise SystemExit('DT PostgreSQL tests must run without skips')
          print(f'{len(cases)} PostgreSQL tests executed without skips')
          PY
      - name: Upload DT writer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dt-writer-results
          path: dt-writer-results.xml
          retention-days: 30

  post-deploy-healthcheck:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: github.ref == 'refs/heads/new-architecture' && github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - name: Wait for Railway deploy
        run: sleep 120

      - name: Check bot health
        # BOT_HEALTH_URL = Railway domain, e.g. https://aist-bot-newarchitecture-production.up.railway.app
        run: |
          BOT_URL="${{ secrets.BOT_HEALTH_URL }}"
          if [ -z "$BOT_URL" ]; then
            echo "BOT_HEALTH_URL secret not set, skipping"
            exit 0
          fi
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BOT_URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Bot is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying in 30s..."
            sleep 30
          done
          echo "Bot health check failed after 3 attempts"
          exit 1
