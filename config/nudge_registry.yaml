# ═══════════════════════════════════════════════════════════════════
# WP-117 Canonical Nudge Registry
# ═══════════════════════════════════════════════════════════════════
#
# Machine-readable source-of-truth for nudge taxonomy:
#   rule_id  -> canonical_type, eligible_tiers, opt_out_category, phase, data_contract
#   nudge_key -> rule_id, cooldown_days, class_cap, payload_keys, ai_personalizable, stopgap
#
# Boundaries:
#   - WP-117 owns the rule/taxonomy and this registry.
#   - WP-418 owns cooldown, class cap, opt-out enforcement and channel policy.
#   - engagement_analyzer.py registers rules at import time; this file maps them.
#
# Versioning: bump `version` whenever the schema or mapping changes.
version: "1.0.0"

# ───────────────────────────────────────────────────────────────────
# 1. RULES: mapping from engagement_analyzer rule_id to canonical metadata.
#    `nudge_keys` lists every concrete key a rule can produce.
# ───────────────────────────────────────────────────────────────────
rules:
  # T1. Реактивация и восстановление engagement
  - rule_id: inactivity_3d
    canonical_type: engagement_reactivation
    eligible_tiers: [T1, T2, T3, T4]
    opt_out_category: engagement
    phase: F1
    nudge_keys: [nudge_inactivity]
    data_contract:
      cooldown_days: 7
      class_cap: class_capped
      payload_keys: []
      ai_personalizable: false
      stopgap: false

  - rule_id: low_engagement_7d
