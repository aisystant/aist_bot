# Описания каналов/чатов для генерации черновиков ответов (SC.118).
#
# Ключ — channel_id (int) или title_pattern (regex для матчинга по названию).
# Если канал не найден по ID — fallback на title_pattern.
# Если ничего не найдено — используется default.
#
# Поля:
#   description: краткое описание тематики канала/чата
#   audience: кто аудитория
#   tone: стиль ответов (экспертный, дружелюбный, ...)
#   topics: ключевые темы для поиска в knowledge-mcp

default:
  description: "Сообщество, связанное с интеллектуальной рабочей средой (IWE) и личным развитием"
  audience: "Участники, интересующиеся саморазвитием и методологиями мышления"
  tone: "Экспертный, дружелюбный, с примерами из практики"
  topics:
    - "IWE платформа"
    - "личное развитие"
    - "методы мышления"

channels:
  # Чаты по тематике — матчинг по title_pattern (case-insensitive regex)
  - title_pattern: "СМ для жизни"
    description: >
      Чат практикума «Системное мышление для жизни».
      Участники изучают системное мышление по курсу Aisystant и применяют его в жизни.
      Темы: системный подход, роли, целевые системы, жизненный мастерство,
      стейкхолдеры, функциональные объекты, методы, практики.
    audience: "Участники практикума СМ, изучающие системное мышление"
    tone: "Наставнический, поддерживающий, с отсылками к курсу"
    topics:
      - "системное мышление"
      - "целевая система"
      - "стейкхолдеры"
      - "роли"
      - "жизненное мастерство"

  - title_pattern: "МС для жизни"
    description: >
      Чат практикума «Методы саморазвития для жизни».
      Участники изучают методы саморазвития: привычки, планирование,
      учёт времени, мультипликатор продуктивности, бюджет часов, WakaTime.
    audience: "Участники практикума МС, работающие над саморазвитием"
    tone: "Практический, с конкретными примерами и числами"
    topics:
      - "методы саморазвития"
      - "мультипликатор"
      - "бюджет часов"
      - "WakaTime"
      - "привычки"
      - "планирование"

  - title_pattern: "IWE.*[Cc]hat|IWE.*чат"
    description: >
      Общий чат сообщества IWE (Intellectual Work Environment).
      Обсуждение платформы, инструментов, Claude Code, экзокортекса,
      цифрового двойника, методологий.
    audience: "Пользователи платформы IWE"
    tone: "Технический и методологический, с практическими советами"
    topics:
      - "IWE платформа"
      - "экзокортекс"
      - "Claude Code"
      - "цифровой двойник"

  - title_pattern: "Aisystant"
    description: >
      Чат, связанный с LMS Aisystant — платформой обучения.
      Курсы, учебные материалы, подписки, функциональность платформы.
    audience: "Пользователи Aisystant"
    tone: "Информативный, поддерживающий"
    topics:
      - "Aisystant"
      - "курсы"
      - "обучение"
