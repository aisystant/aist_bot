# Langfuse self-hosted (L5 Observability, WP-179 Ф3)
#
# Usage:
#   docker compose -f monitoring/docker-compose.langfuse.yml up -d
#
# UI: http://localhost:3000
# Default login: create via UI on first run
#
# Bot env vars (set in Railway or .env):
#   LANGFUSE_SECRET_KEY=sk-lf-...
#   LANGFUSE_PUBLIC_KEY=pk-lf-...
#   LANGFUSE_HOST=http://localhost:3000

version: "3.9"

services:
  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=aist-bot-langfuse-secret-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=aist-bot-salt-change-in-production
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
    depends_on:
      langfuse-db:
        condition: service_healthy
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  langfuse-data:
