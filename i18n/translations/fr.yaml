welcome:
  greeting: "Bonjour ! 👋"
  intro: "Je suis un bot d'apprentissage systématique. Je t'aiderai à maîtriser les compétences d'auto-apprentissage en 14 jours."
  intro_marathon: "🏃 *Marathon (14 jours)*\n• 2 sujets par jour : leçon + pratique\n• Manqué un jour ? Tu peux rattraper, mais seulement 1 jour\n• Le test de systématicité déterminera ton style — le bot adapte le contenu\n• C'est le Niveau 1 — les fondations"
  intro_tiers: "📈 *Et après ?*\nLe bot fait partie de l'Environnement de Travail Intelligent (IWE), comme un IDE, mais pour développer la pensée. Après le marathon, tu débloques :\n• Flux personnalisé et consultant IA\n• Jumeau Numérique — le bot apprend ton contexte\n• Connexion avec le club systemsworld.club\n• Création de connaissances et travail avec des agents IA"
  intro_start: "Commençons ! La configuration prend 1 minute."
  ask_name: "Comment t'appelles-tu ?"
  returning: "Content de te revoir, {name} !"
  menu_greeting: "Salut, {name} ! 👋\n{tier_label}\n\n{tip}"
  mode_menu: "📋 *Menu principal*\nT{tier_num} {tier_label}\n\n{tip}"
  pause_navigator: "Bon retour ! Vous etiez absent {days} jours. Le Navigateur peut vous aider a retrouver le rythme."
  tier_label:
    t0: "🟢 Départ — lie Aisystant pour débloquer toutes les fonctions"
    t1: "🟢 Départ — essaie toutes les fonctions gratuitement pendant 30 jours"
    t2: "📘 Apprentissage — abonnement actif"
    t3: "🧬 Personnalisation — Jumeau Numérique connecté"
    t4: "🚀 Création — toutes les fonctions débloquées"
  tips:
    t0_0: "🔗 Lie ton compte Aisystant → appuie sur « Lier » sur le clavier"
    t0_1: "📚 Marathon de 14 jours — gratuit, même sans liaison"
    t1_0: "📖 Essaie le Flux — résumés sur les sujets que tu choisis → /feed"
    t1_1: "❓ Pose une question au consultant — commence par ? → ?Qu'est-ce que la pensée systémique ?"
    t1_2: "📝 Sauvegarde une pensée en note — écris un point et le texte → .Idée intéressante"
    t1_3: "🧪 Passe le test de systématicité — le bot adapte le contenu pour toi → /test"
    t2_0: "🧬 Connecte le Jumeau Numérique — le bot prendra en compte tes objectifs et intérêts → /me"
    t2_1: "🧪 Repasse le test — vois tes progrès → /test"
    t2_2: "📊 Vois tes données et comment le bot te perçoit → /mydata"
    t3_0: "🚀 Connecte GitHub pour les plans et l'exocortex → /settings"
    t3_1: "📋 Essaie la planification — /plan pour le plan hebdomadaire"
    t4_0: "📋 Toutes les fonctions débloquées ! /plan — plan, /rp — produits de travail"
    t4_1: "📊 Consulte l'analytique de ton apprentissage → /mydata"
  current_mode: "Mode"
  activity_progress: "Activité"
  marathon_welcome: "Bienvenue au Marathon, {name} !"
  marathon_intro: "14 jours pour passer d'apprenant occasionnel à praticien systématique."
  marathon_days_info: "{days} jours — 2 sujets par jour (théorie + pratique)"
  marathon_duration_info: "{minutes} minutes par sujet"
  marathon_reminders_info: "Rappels quotidiens à {time}"
  marathon_personalize_hint: "💡 _Tu veux des leçons personnalisées ? Parle-moi de toi via /profile — et le contenu sera adapté pour toi._"

