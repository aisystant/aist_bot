welcome:
  greeting: "你好！👋"
  intro: "我是系统化学习机器人。14天内帮助你掌握自学技能。"
  intro_marathon: "🏃 *马拉松（14天）*\n• 每天2个主题：课程+练习\n• 错过了？可以补课，但只能补1天\n• 系统性测试将确定你的风格——机器人会调整内容\n• 这是第1级——基础"
  intro_tiers: "📈 *接下来呢？*\n机器人是智能工作环境（IWE）的一部分，就像IDE，但用于思维发展。马拉松之后将解锁：\n• 个性化信息流和AI顾问\n• 数字孪生——机器人了解你的背景\n• 与systemsworld.club社区的联系\n• 知识创造和AI代理工作流"
  intro_start: "开始吧！设置只需1分钟。"
  ask_name: "你叫什么名字？"
  returning: "欢迎回来，{name}！"
  menu_greeting: "你好，{name}！👋\n{tier_label}\n\n{tip}"
  mode_menu: '📋 *主菜单*\nT{tier_num} {tier_label}\n\n{tip}'
  pause_navigator: '欢迎回来！您已离开{days}天。导航员可以帮助您恢复节奏。'
  tier_label:
    t0: "🟢 起步 — 绑定Aisystant解锁所有功能"
    t1: "🟢 起步 — 免费试用所有功能30天"
    t2: "📘 学习中 — 订阅已激活"
    t3: "🧬 个性化 — 数字孪生已连接"
    t4: "🚀 创造 — 所有功能已解锁"
  tips:
    t0_0: "🔗 绑定你的Aisystant账号 → 点击键盘上的「绑定」"
    t0_1: "📚 14天马拉松 — 免费，无需绑定"
