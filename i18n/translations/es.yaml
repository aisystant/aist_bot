welcome:
  greeting: "¡Hola! 👋"
  intro: "Soy un bot de aprendizaje sistemático. Te ayudaré a dominar las habilidades de autoaprendizaje en 14 días."
  intro_marathon: "🏃 *Maratón (14 días)*\n• 2 temas por día: lección + práctica\n• ¿Te lo perdiste? Puedes recuperar, pero solo 1 día\n• El test de sistematicidad determinará tu estilo — el bot adapta el contenido\n• Este es el Nivel 1 — la base"
  intro_tiers: "📈 *¿Qué sigue?*\nEl bot es parte del Entorno de Trabajo Inteligente (IWE), como un IDE, pero para desarrollar el pensamiento. Después del maratón se desbloquean:\n• Feed personalizado y consultor IA\n• Gemelo Digital — el bot aprende tu contexto\n• Conexión con el club systemsworld.club\n• Creación de conocimiento y trabajo con agentes IA"
  intro_start: "¡Empecemos! La configuración toma 1 minuto."
  ask_name: "¿Cómo te llamas?"
  returning: "¡Bienvenido de nuevo, {name}!"
  menu_greeting: "¡Hola, {name}! 👋\n{tier_label}\n\n{tip}"
  mode_menu: "📋 *Menú principal*\nT{tier_num} {tier_label}\n\n{tip}"
  tier_label:
    t0: "🟢 Inicio — vincula Aisystant para desbloquear todas las funciones"
    t1: "🟢 Inicio — prueba todas las funciones gratis por 30 días"
    t2: "📘 Aprendizaje — suscripción activa"
    t3: "🧬 Personalización — Gemelo Digital conectado"
    t4: "🚀 Creación — todas las funciones desbloqueadas"
  tips:
    t0_0: "🔗 Vincula tu cuenta de Aisystant → pulsa «Vincular» en el teclado"
    t0_1: "📚 Maratón de 14 días — gratis, incluso sin vincular"
    t1_0: "📖 Prueba el Feed — resúmenes sobre temas que tú eliges → /feed"
    t1_1: "❓ Pregunta al consultor — empieza con ? → ?¿Qué es el pensamiento sistémico?"
    t1_2: "📝 Guarda una idea como nota — escribe un punto y el texto → .Idea interesante"
    t1_3: "🧪 Haz el test de sistematicidad — el bot adapta el contenido para ti → /test"
    t2_0: "🧬 Conecta el Gemelo Digital — el bot tendrá en cuenta tus metas e intereses → /me"
    t2_1: "🧪 Repite el test — mira tu progreso → /test"
    t2_2: "📊 Mira tus datos y cómo te ve el bot → /mydata"
    t3_0: "🚀 Conecta GitHub para planes y exocórtex → /settings"
    t3_1: "📋 Prueba la planificación — /plan para el plan semanal"
    t4_0: "📋 ¡Todas las funciones desbloqueadas! /plan — plan, /rp — productos de trabajo"
    t4_1: "📊 Mira la analítica de tu aprendizaje → /mydata"
  current_mode: "Modo"
  activity_progress: "Actividad"
  marathon_welcome: "¡Bienvenido al Maratón, {name}!"
  marathon_intro: "14 días de estudiante casual a practicante sistemático."
  marathon_days_info: "{days} días — 2 temas por día (teoría + práctica)"
  marathon_duration_info: "{minutes} minutos por tema"
