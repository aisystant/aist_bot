legal:
  tos_text:
    ru: "📄 *Условия использования IWE v0.1*\n\nРегулирует отношения между пользователем и ИП Церенов Ц.И. при использовании сервиса IWE, бота @aist\\_me\\_bot и связанных продуктов.\n\n*Ключевые моменты:*\n— Регистрация через Telegram или OAuth\n— Подписка с автопродлением, отмена через /subscription\n— Возврат средств — 14 дней (ст. 26.1 ЗоЗПП)\n— Ваш контент — ваша собственность\n— AI-ответы не являются профессиональными консультациями\n\n📖 Полный текст: https://docs.system-school.ru/iwe/tos\n\nВопросы: /contacts"
    en: "📄 *IWE Terms of Service v0.1*\n\nGoverns the relationship between users and the service operator.\n\n*Key points:*\n— Registration via Telegram or OAuth\n— Subscription with auto-renewal, cancel via /subscription\n— Refunds within 14 days\n— Your content is your property\n— AI responses are not professional advice\n\n📖 Full text: https://docs.system-school.ru/iwe/tos\n\nQuestions: /contacts"

  privacy_text:
    ru: "🔒 *Политика конфиденциальности IWE*\n\n*Что мы собираем:*\n— Идентификаторы: telegram\\_id, ory\\_id (для работы сервиса)\n— Интеграции (GitHub, Google Calendar, WakaTime) — только с вашего согласия через OAuth\n— История сессий — 30 дней\n\n*Что мы НЕ делаем:*\n— Не храним данные банковских карт\n— Не передаём данные в рекламных целях\n— Claude Anthropic обрабатывает сообщения с DPA (не обучает на ваших данных)\n\n*Ваши права:*\n/mydata — посмотреть свои данные\n/mydata-delete — удалить аккаунт\n\nDPO: info@system-school.ru\nTelegram: @tserentserenov\n\n📖 Полный текст: https://docs.system-school.ru/iwe/privacy"
    en: "🔒 *IWE Privacy Policy*\n\n*What we collect:*\n— Identifiers: telegram\\_id, ory\\_id (required for service)\n— Integrations (GitHub, Google Calendar, WakaTime) — only with your OAuth consent\n— Session history — 30 days\n\n*What we do NOT do:*\n— Do not store bank card data\n— Do not share data for advertising\n— Claude Anthropic processes messages under DPA (no training on your data)\n\n*Your rights:*\n/mydata — view your data\n/mydata-delete — delete account\n\nDPO: info@system-school.ru\nTelegram: @tserentserenov\n\n📖 Full text: https://docs.system-school.ru/iwe/privacy"

