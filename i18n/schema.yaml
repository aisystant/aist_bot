# -----------------------------------------------------------------------------
# IWE Connect wizard (WP-209 Ф1)
# -----------------------------------------------------------------------------
connect:
  title:
    ru: "Подключение IWE к AI-ассистенту"
    en: "Connect IWE to AI assistant"

  subtitle:
    ru: "IWE подключается к твоему AI-ассистенту за 2 минуты. Помощник получит доступ к базе знаний (5000+ документов) и твоему профилю."
    en: "IWE connects to your AI assistant in 2 minutes. The assistant gets access to the knowledge base (5000+ documents) and your profile."

  choose_client:
    ru: "Выбери свой AI-ассистент:"
    en: "Choose your AI assistant:"

  done:
    ru: "Готово"
    en: "Done"

  back_to_list:
    ru: "← Назад к списку"
    en: "← Back to list"

  need_start:
    ru: "Сначала нажми /start для регистрации."
    en: "Please /start first to register."

  closed:
    ru: "Набери /connect в любой момент, чтобы вернуться к инструкциям."
    en: "Type /connect anytime to return to instructions."

  # --- claude.ai ---
  open_claude:
    ru: "Открыть настройки claude.ai"
    en: "Open claude.ai settings"

  claude_instructions:
    ru: |
      *Claude (claude.ai)*

      1. Перейди по ссылке: claude.ai/customize/connectors
      2. Нажми `+` → *Add custom connector*
      3. Name: `IWE`, URL: `{gateway_url}`
      4. Нажми Save → авторизуйся через аккаунт system-school.ru

      После авторизации проверь: в новом чате должно быть более 30 Tools и кнопка *Custom*.

      Открой новый чат и напиши: «С чего мне начать?»
    en: |
      *Claude (claude.ai)*

      1. Go to: claude.ai/customize/connectors
      2. Click `+` → *Add custom connector*
      3. Name: `IWE`, URL: `{gateway_url}`
      4. Click Save → authorize via system-school.ru account

      After auth check: new chat should show 30+ Tools and a *Custom* button.

      Open a new chat and type: "Where should I start?"

  # --- Cursor / Windsurf / Cline ---
  cursor_instructions:
    ru: |
      *Cursor / Windsurf / Cline*

      Добавь в файл `.mcp.json` в корне проекта:

      ```
      "iwe-knowledge": {{
        "type": "http",
        "url": "{gateway_url}"
      }}
      ```

      Перезапусти редактор. При первом вызове — авторизация через браузер.
    en: |
      *Cursor / Windsurf / Cline*

      Add to `.mcp.json` in your project root:

      ```
      "iwe-knowledge": {{
        "type": "http",
        "url": "{gateway_url}"
      }}
      ```

      Restart the editor. First call will prompt browser auth.

  # --- ChatGPT ---
  chatgpt_instructions:
    ru: |
      *ChatGPT*

      Требуется Business или Enterprise план.

      1. Workspace Settings → MCP
      2. Добавь новый MCP connector
      3. URL: `{gateway_url}`
      4. Авторизуйся через аккаунт system-school.ru

      ChatGPT получит доступ к тем же знаниям, что и другие клиенты.
    en: |
      *ChatGPT*

      Requires Business or Enterprise plan.

      1. Workspace Settings → MCP
      2. Add new MCP connector
      3. URL: `{gateway_url}`
      4. Authorize via system-school.ru account

      ChatGPT will access the same knowledge as other clients.

  # --- Claude Code ---
  claude_code_instructions:
    ru: |
      *Claude Code (полный IWE)*

      Это полная версия: планирование дня, ИИ-стратег, автоматические отчёты.

      Инструкция по установке:
      github.com/TserenTserenov/FMT-exocortex-template

      После установки запусти `bash setup/setup.sh` — он создаст `.mcp.json` автоматически.
    en: |
      *Claude Code (full IWE)*

      This is the full version: day planning, AI strategist, automatic reports.

      Setup guide:
