    en: "❓ *Ask anything*\n\nStart your message with `?` and ask any question:\n\n• About self-development methods\n• About the platform and bot\n• About personal development and thinking\n\nExamples:\n`?What is self-discipline?`\n`?How do I start building my IWE?`\n`?What's the difference between feed and marathon?`"

