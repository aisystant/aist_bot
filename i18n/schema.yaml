    en: |
      • Digital Twin (self-assessment, indicators, roles, problems, objective)
  privacy_details_btn:
    ru: "Подробнее"
    en: "More details"
  privacy_text:
    ru: |
      *Что мы собираем:*
      • Профиль (имя, профессия, интересы, цели)
      • Прогресс (ответы, фиксации, пройденные темы)
      • Активность (дни, серия, время сессий)
      • Консультации (вопросы и ответы)
      • Техническое (ID чата, язык, состояние FSM)

      *Где хранятся:*
      PostgreSQL на Neon.com (EU, шифрование at rest)

      *Кому передаём:*
      Никому. Данные не передаются третьим лицам.
      • Claude API (Anthropic): профиль + текст вопроса. Anthropic не использует данные API для обучения моделей.
      • GitHub API: только при добровольном OAuth, только для записи заметок.
      • Агрегированная аналитика (DAU/MAU): без идентификации пользователя.

      *Что НЕ собираем:*
      IP-адреса, геолокацию, данные других приложений, финансовые данные (кроме статуса подписки).
    en: |
      *What we collect:*
      • Profile (name, occupation, interests, goals)
      • Progress (answers, fixations, completed topics)
      • Activity (days, streak, session time)
      • Consultations (questions and answers)
      • Technical (chat ID, language, FSM state)

      *Where stored:*
      PostgreSQL on Neon.com (EU, encryption at rest)

      *Who we share with:*
      Nobody. Data is never shared with third parties.
      • Claude API (Anthropic): profile + question text. Anthropic does not use API data for training.
      • GitHub API: only with voluntary OAuth, only for writing notes.
      • Aggregated analytics (DAU/MAU): no user identification.

      *What we do NOT collect:*
      IP addresses, geolocation, other app data, financial data (except subscription status).

