# =============================================================================
# AIST Bot - Схема локализации
# =============================================================================
#
# Этот файл содержит ВСЕ ключи локализации с переводами на русский и английский.
# Русский — источник истины для смысла.
# Английский — база для переводчиков на другие языки.
#
# Структура ключа:
#   key_name:
#     ru: "Русский текст"
#     en: "English text"
#     description: "Контекст для переводчика (опционально)"
#     max_length: 20  # Для кнопок (опционально)
#
# Плейсхолдеры: {name}, {day}, {count} и т.п. — ОБЯЗАТЕЛЬНО сохранять при переводе
#
# =============================================================================

# -----------------------------------------------------------------------------
# Приветствие
# -----------------------------------------------------------------------------
welcome:
  greeting:
    ru: "Привет! 👋"
    en: "Hello! 👋"
    description: "Первое сообщение при входе в бота"

  intro:
    ru: "Я — бот для систематического обучения. Помогу освоить навыки самообучения за 14 дней."
    en: "I'm a systematic learning bot. I'll help you master self-learning skills in 14 days."

  intro_marathon:
    ru: "🏃 *Марафон (14 дней)*\n• 2 темы в день: урок + практика\n• Пропустил? Можно догнать, но только 1 день\n• Тест систематичности определит твой стиль — бот адаптирует контент\n• Это первый уровень — фундамент"
    en: "🏃 *Marathon (14 days)*\n• 2 topics per day: theory + practice\n• Missed a day? You can catch up, but only 1 day\n• Systematicity test determines your style — the bot adapts content\n• This is Level 1 — the foundation"

  intro_tiers:
    ru: "📈 *Что дальше?*\nБот — часть интеллектуальной рабочей среды (IWE), как IDE, но для развития мышления. После марафона откроются:\n• Персональная лента и ИИ-консультант\n• Цифровой двойник — бот учитывает твой контекст\n• Связь с клубом systemsworld.club\n• Создание знаний и работа с ИИ-агентами"
    en: "📈 *What's next?*\nThe bot is part of an Intellectual Work Environment (IWE) — like an IDE, but for developing thinking. After the marathon you'll unlock:\n• Personalized feed and AI consultant\n• Digital Twin — the bot learns your context\n• Connection with systemsworld.club\n• Knowledge creation and AI agent workflows"

  intro_start:
    ru: "📚 *Марафон* — пошаговые уроки за 14 дней\n📖 *Лента* — свободный темп, выбирайте темы сами (переключить в ⚙️ Настройках)\n\nНажмите кнопку ниже, чтобы начать."
    en: "📚 *Marathon* — step-by-step lessons over 14 days\n📖 *Feed* — free pace, choose topics yourself (switch in ⚙️ Settings)\n\nPress a button below to start."

  marathon_welcome:
    ru: "Добро пожаловать в марафон, {name}!"
    en: "Welcome to the Marathon, {name}!"

  marathon_intro:
    ru: "14 дней от случайного ученика к систематическому."
    en: "14 days from casual learner to systematic practitioner."

  marathon_days_info:
    ru: "{days} дней — по 2 темы в день (урок + задание)"
    en: "{days} days — 2 topics per day (theory + practice)"

  marathon_duration_info:
    ru: "{minutes} минут на каждую тему"
    en: "{minutes} minutes per topic"

  marathon_reminders_info:
    ru: "Напоминания каждый день в {time}"
    en: "Daily reminders at {time}"

  marathon_personalize_hint:
    ru: "💡 _Хочешь персональные уроки? Расскажи о себе через /profile — и контент будет адаптирован под тебя._"
    en: "💡 _Want personalized lessons? Tell me about yourself via /profile — and content will be tailored to you._"

  ask_name:
    ru: "Как тебя зовут?"
    en: "What's your name?"

  returning:
    ru: "С возвращением, {name}!"
    en: "Welcome back, {name}!"

  menu_greeting:
    ru: "Привет, {name}! 👋\n{tier_label}\n\n{tip}"
    en: "Hi, {name}! 👋\n{tier_label}\n\n{tip}"
    es: "Hola, {name}! 👋\n{tier_label}\n\n{tip}"
    fr: "Salut, {name} ! 👋\n{tier_label}\n\n{tip}"
    zh: '你好，{name}！👋\n{tier_label}\n\n{tip}'

  mode_menu:
    ru: "📋 *Главное меню*\nT{tier_num} {tier_label}\n\n{tip}"
    en: "📋 *Main menu*\nT{tier_num} {tier_label}\n\n{tip}"

  pause_navigator:
    ru: "С возвращением! Тебя не было {days} дней. С чего продолжим?"
    en: "Welcome back! You've been away for {days} days. Where would you like to start?"

  # Tier labels for greeting (П1 — прогресс-бар)
  tier_label:
    t0:
      ru: "🎯 Уровень: Т1 «Старт» — привяжи аккаунт чтобы открыть функции"
      en: "🎯 Level: T1 «Start» — link your account to unlock features"
    t1:
      ru: "🎯 Уровень: Т1 «Старт» — 30 дней бесплатного доступа"
      en: "🎯 Level: T1 «Start» — 30 days free access"
    t2:
      ru: "📘 Уровень: Т2 «Изучение» (подписка активна)"
      en: "📘 Level: T2 «Learning» (subscription active)"
    t3:
      ru: "🧬 Уровень: Т3 «Персонализация» (ЦД подключён)"
      en: "🧬 Level: T3 «Personalization» (Digital Twin connected)"
    t4:
      ru: "🚀 Уровень: Т4 «Созидание» — все инструменты открыты"
      en: "🚀 Level: T4 «Creation» — all tools unlocked"

  # Tier tips — ротация подсказок (П4). Numbered keys (loader не поддерживает lists).
  tips:
    t0_0:
      ru: "🔗 Привяжи аккаунт Aisystant → нажми «Привязать» на клавиатуре"
      en: "🔗 Link your Aisystant account → tap «Link» on the keyboard"
    t0_1:
      ru: "📚 Марафон 14 дней — бесплатно, даже без привязки"
      en: "📚 14-day Marathon — free, even without linking"
    t1_0:
      ru: "📖 Попробуй Ленту — дайджесты по темам, которые выбираешь сам → /feed"
      en: "📖 Try the Feed — digests on topics you choose → /feed"
    t1_1:
      ru: "❓ Задай вопрос консультанту — начни с ? → ?Что такое системное мышление?"
      en: "❓ Ask the consultant — start with ? → ?What is systems thinking?"
    t1_2:
      ru: "📝 Сохрани мысль заметкой — напиши точку и текст → .Интересная идея"
      en: "📝 Save a thought as a note — type dot and text → .Interesting idea"
    t1_3:
      ru: "🧪 Пройди тест систематичности — бот адаптирует контент под тебя → /test"
      en: "🧪 Take the systematicity test — bot adapts content for you → /test"
    t2_0:
      ru: "🧬 Подключи Цифровой двойник — бот учтёт твои цели и интересы → /me"
      en: "🧬 Connect Digital Twin — bot considers your goals and interests → /me"
    t2_1:
      ru: "🧪 Пройди тест повторно — посмотри свой прогресс → /test"
      en: "🧪 Retake the test — check your progress → /test"
    t2_2:
      ru: "📊 Посмотри свои данные и как бот тебя видит → /mydata"
      en: "📊 See your data and how the bot sees you → /mydata"
    t3_0:
      ru: "🚀 Подключи GitHub для работы с планами и экзокортексом → /settings"
      en: "🚀 Connect GitHub for plans and exocortex → /settings"
    t3_1:
      ru: "📋 Попробуй планирование — /plan для недельного плана"
      en: "📋 Try planning — /plan for weekly plan"
    t4_0:
      ru: "📋 Все возможности открыты! /plan — план, /rp — рабочие продукты"
      en: "📋 All features unlocked! /plan — plan, /rp — work products"
    t4_1:
      ru: "📊 Посмотри аналитику своего обучения → /mydata"
      en: "📊 Check your learning analytics → /mydata"

  current_mode:
    ru: "Режим"
    en: "Mode"

  activity_progress:
    ru: "Активность"
    en: "Activity"

  link_reminder:
    ru: "🔗 Этот бот — часть образовательной платформы Aisystant. Привяжите свой Telegram к аккаунту Aisystant, чтобы получить доступ к расписанию, программам и оплате — нажмите *🔗 Привязать* или /link"
    en: "🔗 This bot is part of the Aisystant learning platform. Link your Telegram to your Aisystant account to access schedule, programs and payments — press *🔗 Link* or /link"
    es: "🔗 Este bot es parte de la plataforma educativa Aisystant. Vincula tu Telegram a tu cuenta de Aisystant para acceder a horarios, programas y pagos — pulsa *🔗 Vincular* o /link"
    fr: "🔗 Ce bot fait partie de la plateforme éducative Aisystant. Liez votre Telegram à votre compte Aisystant pour accéder à l'horaire, aux programmes et aux paiements — appuyez sur *🔗 Lier* ou /link"
    zh: "🔗 此机器人是 Aisystant 教育平台的一部分。将您的 Telegram 关联到 Aisystant 账户即可访问日程、项目和付款 — 请按 *🔗 关联* 或 /link"

