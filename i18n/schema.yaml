nudges:
  nudge_slot_missing_3d:
    ru: "📝 Вы не записывали время занятий уже несколько дней. Один /slot сегодня поможет удержать ритм и ступень."
    en: "📝 You haven't logged study time for a few days. One /slot today helps maintain your rhythm and stage."

  nudge_inactivity:
    ru: "👋 Привет! Мы заметили, что вас не было несколько дней. Как дела? Возвращайтесь — ваш прогресс ждёт вас."
    en: "👋 Hi there! We noticed you haven't been around for a few days. How are things? Come back — your progress is waiting."

  nudge_streak_drop:
    ru: "🔥 Ваш рекорд серии — {streak} дней подряд. Сейчас серия прервана. Один урок сегодня — и вы снова в деле!"
    en: "🔥 Your best streak was {streak} days in a row. It's currently broken. One lesson today and you're back on track!"

  nudge_low_engagement:
    ru: "📊 За последнюю неделю активность была низкой. Даже 5 минут с одним дайджестом помогут удержать ритм."
    en: "📊 Activity was low this past week. Even 5 minutes with one digest helps maintain your rhythm."

  nudge_marathon_stalled:
    ru: "🏃 Ваш марафон ждёт продолжения! Следующий урок готов — нажмите /learn."
    en: "🏃 Your marathon is waiting! The next lesson is ready — tap /learn."

  nudge_sessions_10:
    ru: "🎉 10 сессий! Отличный старт. Продолжайте — каждая сессия укрепляет навыки."
    en: "🎉 10 sessions! Great start. Keep going — every session builds your skills."

  nudge_sessions_25:
    ru: "🌟 25 сессий — вы уже в числе активных учеников! Попробуйте /twin для обзора прогресса."
    en: "🌟 25 sessions — you're among active learners! Try /twin for a progress overview."

  nudge_sessions_50:
    ru: "💪 50 сессий! Это серьёзный результат. Ваш цифровой двойник отражает ваш рост."
    en: "💪 50 sessions! That's a solid achievement. Your digital twin reflects your growth."

  nudge_sessions_100:
    ru: "🏆 100 сессий! Вы — один из самых систематичных учеников платформы."
    en: "🏆 100 sessions! You're one of the most systematic learners on the platform."

  nudge_active_days_7:
    ru: "📅 7 активных дней! Первая неделя систематичной работы — отличная основа."
    en: "📅 7 active days! Your first week of systematic work — a great foundation."

  nudge_active_days_14:
    ru: "📅 14 активных дней — две недели практики. Навыки начинают закрепляться!"
    en: "📅 14 active days — two weeks of practice. Skills are starting to stick!"

  nudge_active_days_30:
    ru: "🎯 30 активных дней! Месяц систематичного обучения — это уже привычка."
    en: "🎯 30 active days! A month of systematic learning — it's a habit now."

  # Derived-aware nudges (WP-117 Ф3, dep: WP-151 Ф4)
  nudge_stage_reached_2:
    ru: "📈 Вы перешли на ступень *Систематический*! Ваша регулярность и количество тренировок говорят о серьёзном подходе. Следующая цель — дисциплина: 6 дней в неделю."
    en: "📈 You've reached the *Systematic* stage! Your regularity and training count show a serious approach. Next goal — discipline: 6 days a week."

  nudge_stage_reached_3:
    ru: "🏅 Ступень *Дисциплинированный*! Вы занимаетесь почти каждый день. Осталось: стратегирование и передача знаний другим."
    en: "🏅 *Disciplined* stage! You practice almost every day. Next: strategizing and sharing knowledge."

  nudge_stage_reached_4:
    ru: "🌟 Ступень *Проактивный*! Вы в числе самых активных участников. Ваш вклад в сообщество делает платформу сильнее."
    en: "🌟 *Proactive* stage! You're among the most active participants. Your community contribution makes the platform stronger."

  nudge_agency_growing:
    ru: "📊 Ваш индекс агентности растёт — вы на правильном пути. Сохраняйте ритм: регулярность важнее интенсивности."
    en: "📊 Your agency index is growing — you're on the right track. Keep your rhythm: consistency matters more than intensity."

  nudge_agency_high:
    ru: "💎 Высокий индекс агентности! Вы систематичны и продуктивны. Попробуйте /twin для полного обзора вашего прогресса."
    en: "💎 High agency index! You're systematic and productive. Try /twin for a full overview of your progress."

  nudge_low_regularity:
    ru: "📅 Вы активны, но нерегулярно — {active_days} активных дней разбросаны неравномерно. Попробуйте выделить фиксированный слот каждый день — даже 15 минут."
    en: "📅 You're active but irregular — {active_days} active days are spread unevenly. Try a fixed daily slot — even 15 minutes."

  nudge_reduce_frequency:
    ru: "🔕 Мы отправляем много уведомлений, а активность невысокая. Снижаем частоту — качество важнее количества. Зайдите, когда будет удобно."
    en: "🔕 We've been sending many notifications, but activity is low. Reducing frequency — quality over quantity. Come back when you're ready."

  # Diagnost bottleneck nudges (WP-117 Ф-roles): фокус на слоте с наименьшей оценкой из cp-профиля (DP.ROLE.042 §2)
  nudge_bottleneck_cp_rhy:
    ru: "📆 Диагност отметил: ваше слабое место сейчас — ритм. Попробуйте закрепить регулярный слот для занятий."
    en: "📆 The Diagnostician flagged your current focus area: rhythm. Try locking in a regular study slot."

  nudge_bottleneck_cp_wld:
    ru: "🧭 Диагност отметил: ваше слабое место сейчас — мировоззрение. Попробуйте принять одно решение сегодня через явные ценности, а не интуитивно."
    en: "🧭 The Diagnostician flagged your current focus area: worldview. Try making one decision today through explicit values, not intuition."

  nudge_bottleneck_cp_skl:
    ru: "🛠 Диагност отметил: ваше слабое место сейчас — навык. Попробуйте довести один рабочий продукт до конца сегодня."
    en: "🛠 The Diagnostician flagged your current focus area: skill. Try finishing one work product today."

  nudge_bottleneck_cp_int:
    ru: "🧩 Диагност отметил: ваше слабое место сейчас — интеграция знаний. Попробуйте применить одно системное различение к реальной ситуации."
    en: "🧩 The Diagnostician flagged your current focus area: knowledge integration. Try applying one systemic distinction to a real situation."

  nudge_bottleneck_cp_agt:
    ru: "🚀 Диагност отметил: ваше слабое место сейчас — агентность. Попробуйте сегодня сделать один шаг по своей инициативе, не дожидаясь напоминания."
    en: "🚀 The Diagnostician flagged your current focus area: agency. Try taking one self-initiated step today, without waiting for a reminder."

  settings_nudges_button:
    ru: "Подбадривание"
    en: "Nudges"

  settings_nudges_description:
    ru: "Бот подбадривает вас на основе вашей активности: поздравляет с достижениями, напоминает о незавершённых уроках и помогает не терять темп обучения."
    en: "Bot encourages you based on your activity: celebrates achievements, reminds about incomplete lessons, and helps maintain your learning pace."

  settings_nudges_enable:
    ru: "Включить"
    en: "Enable"

  settings_nudges_disable:
    ru: "Выключить"
    en: "Disable"

  settings_nudges_on:
    ru: "🔔 Подбадривание включено."
    en: "🔔 Nudges enabled."

  settings_nudges_off:
    ru: "🔕 Подбадривание отключено."
    en: "🔕 Nudges disabled."

