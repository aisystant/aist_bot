    en: "💡 *Why a subscription?*\n\nEvery bot response is individually generated using AI — this costs real money (API tokens). The «Intelligence Engineering» subscription (system-school.ru/open-endedness) covers these costs and helps improve the product.\n\n💰 All funds go towards product development and promotion."

