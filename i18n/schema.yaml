# -----------------------------------------------------------------------------
# Справка
# -----------------------------------------------------------------------------
help:
  title:
    ru: "📖 Справка"
    en: "📖 Help"

  intro:
    ru: "Бот — часть интеллектуальной рабочей среды для развития мышления.\nЕжедневные уроки, тренировки, ИИ-консультант и цифровой двойник — всё в одном месте."
    en: "The bot is part of an Intellectual Work Environment for developing thinking.\nDaily lessons, training, AI consultant and digital twin — all in one place."

  getting_started:
    ru: "🚀 С чего начать"
    en: "🚀 Getting started"

  mode_hint:
    ru: "Выберите режим через /mode:"
    en: "Choose a mode via /mode:"

  modes_title:
    ru: "Режимы обучения"
    en: "Learning modes"

  marathon:
    ru: "Марафон"
    en: "Marathon"

  marathon_short:
    ru: "📚 *Марафон* — готовая программа на 14 дней (рекомендую для старта)"
    en: "📚 *Marathon* — ready-made 14-day program (recommended to start)"

  marathon_desc:
    ru: "14-дневная структурированная программа. Каждый день — урок (теория + вопрос) и задание с рабочим продуктом. Темы идут последовательно."
    en: "14-day structured program. Each day — a lesson (theory + question) and a task with deliverable. Topics go sequentially."

  feed:
    ru: "Лента"
    en: "Feed"

  feed_short:
    ru: "📖 *Лента* — выбираете темы сами, учитесь в своём ритме"
    en: "📖 *Feed* — choose topics yourself, learn at your own pace"

  feed_desc:
    ru: "Гибкий режим для тех, кто хочет изучать темы в своём темпе без ограничений по дедлайнам. Вы выбираете до 3 тем и получаете ежедневные дайджесты. После каждого дайджеста — фиксация (ваш личный вывод)."
    en: "Flexible mode for those who want to study topics at their own pace without deadline restrictions. You choose up to 3 topics and receive daily digests. After each digest — a fixation (your personal takeaway)."

  about_marathon:
    ru: "📚 Режимы обучения:"
    en: "📚 Learning modes:"

  ai_hint:
    ru: "❓ *Спроси что угодно* — начни с `?`\n`?Что значит собранность?`\n`?Как мне начать создавать IWE?`"
    en: "❓ *Ask anything* — start with `?`\n`?What is self-discipline?`\n`?How do I start building my IWE?`"

  notes_hint:
    ru: "📝 *Заметка* — начни с `.`\n`.прочитать главу 3 до пятницы`"
    en: "📝 *Note* — start with `.`\n`.read chapter 3 by Friday`"

  tiers_hint:
    ru: "📊 *Уровни платформы*\nНа платформе 4 уровня — от марафона до создания знаний и работы с ИИ-агентами.\nСвой уровень и прогресс смотри в /mydata"
    en: "📊 *Platform levels*\nYou progress through 4 levels — from marathon to knowledge creation and AI agents.\nCheck your level and progress in /mydata"

  ai_questions:
    ru: "В обоих режимах работает функция вопроса к ИИ. Начните сообщение с ? чтобы задать вопрос."
    en: "In both modes, you can ask questions to AI. Start your message with ? to ask."

  ai_questions_example:
    ru: "Пример: ?Что такое собранность?"
    en: "Example: ?What is self-discipline?"

  commands_title:
    ru: "Команды бота"
    en: "Bot commands"

  all_commands:
    ru: "Все команды"
    en: "All commands"

  feed_cmd:
    ru: "получить дайджест (Лента)"
    en: "get digest (Feed)"

  how_it_works:
    ru: "Как использовать бот"
    en: "How to use the bot"

  step1:
    ru: "1. Вы заранее устанавливаете режим, время получения контента и т.п."
    en: "1. You set up mode, content delivery time, etc."

  step2:
    ru: "2. Я отправляю персонализированный материал"
    en: "2. I send personalized material"

  step3:
    ru: "3. Вы изучаете его (5-25 мин)"
    en: "3. You study it (5-25 min)"

  step4:
    ru: "4. Отвечаете на вопрос или пишете фиксацию"
    en: "4. Answer a question or write a fixation"

  step5:
    ru: "5. День засчитывается в прогресс"
    en: "5. Day counts toward progress"

  schedule_note:
    ru: "Рекомендуется установить время получения контента — так вы не будете ждать слишком долго. Или запросите его командой, но подождите примерно 1 минуту. Бот в это время формирует динамический контекст для обращения к ИИ, используя ваши данные и обращаясь к хранилищам данных МИМ."
    en: "It's recommended to set content delivery time — so you don't wait too long. Or request it via command, but wait about 1 minute. The bot creates dynamic context for AI, using your data and MIM knowledge bases."

  subscription_title:
    ru: "Подписка"
    en: "Subscription"

  subscription_info:
    ru: "Лента, консультант, заметки и планы доступны по подписке.\nПервые 30 дней — бесплатно. Оформить: /settings"
    en: "Feed, consultant, notes and plans require a subscription.\nFirst 30 days free. Subscribe: /settings"

  feedback:
    ru: "Замечания и предложения"
    en: "Feedback and suggestions"
  feedback_or:
    ru: "или"
    en: "or"
  feedback_line:
    ru: "💬 Обратная связь: /feedback или знак «!», а далее ваш текст."
    en: "💬 Feedback: /feedback or type \"!\" followed by your message."

  about_hint:
    ru: "ℹ️ О платформе и экосистеме: /about"
    en: "ℹ️ About the platform and ecosystem: /about"

  language_hint:
    ru: "💡 Change bot language: /settings → Language"
    en: "💡 Change bot language: /settings → Language"

