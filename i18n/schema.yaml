# ═══════════════════════════════════════════════════════════
# Info-команды: навигационные landing pages
# ═══════════════════════════════════════════════════════════
info:
  # --- /about ---
  about_text:
    ru: "ℹ️ *О нас*\n\n*Экосистема развития интеллекта* — среда, в которой люди развивают мышление и становятся созидателями: себя, команд, сообществ и общества.\n\n*Что мы даём:*\n• *Мастерская* — практикумы, резидентуры, семинары и разборы для бесконечного развития\n• *Сообщество* — более 13 000 инженеров-менеджеров (systemsworld.club)\n• *ИИ-платформа* — персональный путь, ИИ-консультант, цифровой двойник (ЦД) — интеллектуальная рабочая среда (IWE)\n\n*Бот* — часть IWE. Через него вы получаете уроки, тренируете принципы, задаёте вопросы ИИ-консультанту, отслеживаете прогресс, управляете расписанием и оплатой, а также получаете доступ к ЦД и программам обучения. Подробнее: /help\n\n*С чего начать?*"
    en: "ℹ️ *About us*\n\n*Ecosystem for Intelligence Development* — an environment where people develop thinking and become creators: of themselves, teams, communities and society.\n\n*What we offer:*\n• *Workshop* — practicums, residencies, seminars and reviews for infinite development\n• *Community* — over 13,000 engineers-managers (systemsworld.club)\n• *AI platform* — personal path, AI consultant, digital twin (DT) — Intellectual Work Environment (IWE)\n\n*The bot* is part of IWE. Through it you receive lessons, train principles, ask AI consultant questions, track progress, manage schedule and payments, and access your DT and learning programs. More: /help\n\n*Where to start?*"

  # --- /marathon_info ---
  marathon_text:
    ru: "📚 *Марафон*\n\n*Что это?*\nПерсонализированная 14-дневная программа обучения методам саморазвития. Контент адаптируется под вас — бот учитывает ваш профиль, интересы и цели.\n\n*Зачем?*\nЗа 14 дней вы пройдёте путь от случайного обучения к систематическому. Каждый день — урок (теория + вопрос на осмысление) и задание с рабочим продуктом.\n\n*Для кого?*\nДля всех, кто хочет начать. Подписка не нужна — марафон бесплатный.\n\n*Как это работает?*\n1. Бот присылает урок в установленное время\n2. Вы изучаете тему (5-25 мин)\n3. Отвечаете на вопрос\n4. Получаете обратную связь от ИИ\n\n*Настройте под себя:*\nОпишите себя в профиле, укажите время получения уроков, длительность и сложность — и программа станет по-настоящему вашей."
    en: "📚 *Marathon*\n\n*What is it?*\nA personalized 14-day self-development learning program. Content adapts to you — the bot considers your profile, interests and goals.\n\n*Why?*\nIn 14 days you'll go from casual learning to systematic practice. Each day — a lesson (theory + reflection question) and a task with deliverable.\n\n*For whom?*\nFor everyone who wants to start. No subscription needed — the marathon is free.\n\n*How does it work?*\n1. The bot sends a lesson at your scheduled time\n2. You study the topic (5-25 min)\n3. Answer the question\n4. Get AI feedback\n\n*Customize it:*\nDescribe yourself in your profile, set lesson delivery time, duration and difficulty — and the program becomes truly yours."

  # --- /feed_info ---
  feed_text:
    ru: "📖 *Лента*\n\n*Что это?*\nПерсонализированный режим обучения — вы выбираете до 3 тем и получаете ежедневные дайджесты, адаптированные под ваш профиль и цели.\n\n*Зачем?*\nДля тех, кто прошёл марафон и хочет продолжить развитие в своём ритме. Глубже изучайте интересные темы, получайте контент, созданный для вас.\n\n*Для кого?*\nДля пользователей с подпиской «Инженерия интеллекта».\n\n*Как это работает?*\n1. Выбираете темы из каталога\n2. Бот присылает дайджест в установленное время\n3. Изучаете материал (5-25 мин)\n4. Пишете фиксацию — ваш личный вывод\n\n*Настройте под себя:*\nОпишите себя в профиле, укажите время получения дайджестов и сложность — и контент будет максимально релевантным."
    en: "📖 *Feed*\n\n*What is it?*\nA personalized learning mode — choose up to 3 topics and receive daily digests adapted to your profile and goals.\n\n*Why?*\nFor those who completed the marathon and want to continue development at their own pace. Explore topics deeper, get content created for you.\n\n*For whom?*\nFor users with an «Intelligence Engineering» subscription.\n\n*How does it work?*\n1. Choose topics from the catalog\n2. The bot sends a digest at your scheduled time\n3. Study the material (5-25 min)\n4. Write a fixation — your personal takeaway\n\n*Customize it:*\nDescribe yourself in your profile, set digest delivery time and difficulty — and content will be maximally relevant."

  # --- /train_info ---
  train_text:
    ru: "🧠 *Тренировка*\n\n*Что это?*\nИнтерактивная тренировка принципов системного мышления. Вопросы адаптируются под ваш уровень и прогресс.\n\n*Зачем?*\nЧтобы принципы из уроков стали частью мышления. Тренировка проверяет понимание, а не запоминание — вы учитесь применять знания к реальным ситуациям.\n\n*Для кого?*\nДля пользователей с подпиской «Инженерия интеллекта».\n\n*Как это работает?*\n1. Бот задаёт вопрос по изученным принципам\n2. Вы отвечаете своими словами\n3. ИИ оценивает понимание и даёт обратную связь\n4. После 2 неудачных попыток — показывает пример ответа\n\n*Настройте под себя:*\nОпишите себя в профиле и укажите сложность — тренировка адаптируется под ваш уровень."
    en: "🧠 *Training*\n\n*What is it?*\nInteractive training on systems thinking principles. Questions adapt to your level and progress.\n\n*Why?*\nSo that principles from lessons become part of your thinking. Training checks understanding, not memorization — you learn to apply knowledge to real situations.\n\n*For whom?*\nFor users with an «Intelligence Engineering» subscription.\n\n*How does it work?*\n1. The bot asks a question about studied principles\n2. You answer in your own words\n3. AI evaluates understanding and gives feedback\n4. After 2 failed attempts — shows an example answer\n\n*Customize it:*\nDescribe yourself in your profile and set difficulty — training adapts to your level."

