  # ── Privacy ──
  privacy_your_tier:
    ru: "На твоём уровне ({tier}) собираем:"
    en: "At your tier ({tier}) we collect:"
  privacy_t1:
    ru: |
      • Профиль (имя, профессия, язык, уровень опыта, режим)
      • Прогресс марафона (ответы, рабочие продукты)
